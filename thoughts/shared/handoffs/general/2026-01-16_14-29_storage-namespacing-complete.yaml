architecture_notes:
  option_2_rationale: |
    Chose Option 2 (namespace storage keys) over Option 1 (prefix workoutKey values).
    Option 2 advantages:
    - Less invasive - workoutKey remains pure UUID
    - Only persistence layer changes
    - No risk of breaking existing code that reads workoutKey
    - Storage keys are internal implementation detail

  pre_mortem_mitigations_applied: |
    All 5 pre-mortem failure modes from planning session were mitigated:
    1. AsyncStorage key parsing false positives - FIXED with source validation
    2. SQLite key parsing false positives - FIXED with source validation
    3. Resume routing inconsistency - FIXED by adding ?source=self to mini-bar
    4. Orphaned legacy keys - FIXED with proactive migration
    5. Source inference assumes session.source - FIXED with enhanced heuristics

  backward_compatibility_strategy: |
    Read path: Try new format → fallback to legacy → migrate immediately
    Write path: Always use new format
    Clear path: Clear both formats (no-op if one doesn't exist)
    This ensures:
    - Old app versions can't break (they ignore new keys)
    - New app version migrates on first read
    - No user action required
    - No data loss
