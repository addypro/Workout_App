decisions:
  - proactive_migration: |
      Chose immediate migration on read instead of lazy migration on write.
      Rationale: Prevents orphaned legacy keys that would never get migrated if user
      doesn't complete a set after app update. Pre-mortem mitigation #4.
  - source_validation: |
      Added explicit source validation before type casting in key parsing.
      Rationale: Prevents false positives when legacy keys contain colons (e.g. "program:abc:123").
      Pre-mortem mitigations #1 and #2.
  - enhanced_inference: |
      Check assignedWorkoutId and coachId fields when session.source is missing.
      Rationale: Better heuristics for legacy sessions that predate source field.
      Pre-mortem mitigation #5.
  - resume_routing_consistency: |
      Both ResumeHeroCard and ResumeMiniBar now pass ?source=self for self workouts.
      Rationale: Consistency across resume locations, easier debugging.
      Pre-mortem mitigation #3.

findings:
  - storage_key_format: |
      New format: @active_workout:{userId}:{source}:{workoutKey}
      Example self: @active_workout:user-123:self:program-abc
      Example assigned: @active_workout:user-123:assigned:program-abc
      Both can coexist with same workoutKey - collision-free.
  - sqlite_composite_key: |
      SQLite program_id column stores: "${source}:${workoutKey}"
      No schema migration needed - just change the value format.
      UNIQUE index on (user_id, program_id) still works correctly.
  - legacy_migration_path: |
      getActiveWorkoutState() flow:
      1. Try new format (userId, source, workoutKey)
      2. If not found, try legacy format (userId, workoutKey)
      3. If found in legacy, migrate immediately:
         - Write to new format
         - Remove legacy key
      4. Return data
      This prevents orphaned keys and gradual cleanup.
  - call_site_source_availability: |
      All 13 call sites had source available:
      - isAssignedWorkout boolean from query param (8 sites)
      - pendingWorkout.source from session (1 site)
      - Hardcoded 'self' for self-only contexts (4 sites)
      No call site required guessing or unsafe defaults.

