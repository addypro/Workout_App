decisions:
  - async_singleton_pattern: Used Promise caching for initTaxonomyMaps() to prevent race conditions
  - lazy_dynamic_import: Moved 21MB JSON from static import to dynamic import with singleton
  - epley_formula: Used 1RM = weight × (1 + reps/30) for estimated max calculation
  - one_minute_cache: Stats calculations cached for 60s to prevent expensive recalculations
  - react_native_gifted_charts: Chose this library for line charts (good React Native support)

findings:
  - ui_lag_root_causes: 4 issues - async race in search.ts, 21MB JSON at module level, AsyncStorage.getAllKeys scans, 7 nested providers
  - pr_detection_types: ONE_REP_MAX (Epley estimated), REP_PR (by rep count), VOLUME_PR (session volume)
  - streak_logic: Current streak requires workout today or yesterday, then counts consecutive days backward

