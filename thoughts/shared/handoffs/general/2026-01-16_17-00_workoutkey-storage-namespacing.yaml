  target_storage_keys: |
    AsyncStorage: @active_workout:{userId}:{source}:{workoutKey}
    Function: activeWorkoutKey(userId: string, source: WorkoutSource, workoutKey: string)
    Benefit: Source namespace prevents collisions

  migration_strategy: |
